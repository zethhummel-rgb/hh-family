name: HH release validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.repository == 'zethhummel-rgb/hh-family'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      VITE_APP_ENV: test
      VITE_SUPABASE_URL: https://ybizqfghnplcxlmlhvyn.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jbLSo5LPkS9k06Fx1txlBQ_3rWWkWh_
      HH_BROWSER: ${{ matrix.engine }}
      HH_POLISH_OUTPUT: artifacts/full-audit/${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the pinned browser test runner
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx --no-install playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - name: Run all 36 configurations and focused checks
        run: |
          node scripts/polish-browser/input-cards.cjs
          node scripts/polish-browser/scroll-lock.cjs
          node scripts/polish-browser/calendar-views.cjs
          node scripts/polish-browser/journeys.cjs
          node scripts/polish-browser/focused.cjs
          node scripts/polish-browser/signup.cjs
          node scripts/polish-browser/meals.cjs
          node scripts/polish-browser/household-name.cjs
          node scripts/polish-browser/edge-cases.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-browser-results-${{ matrix.engine }}
          path: artifacts/full-audit
          retention-days: 14

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:calendar
      - run: npm run test:database
      - run: npm run test:invitations
      - run: npm run test:recovery
      - run: npm run test:welcome
      - run: npm run test:feedback
      - run: npm run test:polish
      - run: node scripts/check-offline-shopping.mjs
      - run: node scripts/check-portal-search.mjs
      - run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: https://njpdqiwrwgoothkstoql.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Ok3ZhlQo6hYLRWcl68Z_Zw_qKEauTkq
      - run: node scripts/check-production-build.mjs
